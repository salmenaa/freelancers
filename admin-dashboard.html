<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Task Manager</title>
    <link rel="stylesheet" href="assets/css/admin-dashboard.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ Admin Dashboard</h1>
            <button class="btn-back" onclick="goBack()">← Back to Home</button>
        </div>

        <!-- Statistics Cards -->
        <div class="dashboard-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalTasksAdmin">0</div>
                <div class="stat-label">Total Tasks</div>
                <div class="stat-description">All tasks across users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedTasksAdmin">0</div>
                <div class="stat-label">Completed</div>
                <div class="stat-description">Successfully finished</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="inProgressTasksAdmin">0</div>
                <div class="stat-label">In Progress</div>
                <div class="stat-description">Currently being worked on</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingTasksAdmin">0</div>
                <div class="stat-label">Pending</div>
                <div class="stat-description">Awaiting action</div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="chart-container">
            <div class="chart">
                <h3>📊 Tasks by Status</h3>
                <div id="statusChart"></div>
            </div>
            <div class="chart">
                <h3>📈 Tasks by Priority</h3>
                <div id="priorityChart"></div>
            </div>
        </div>

        <!-- All Tasks Section -->
        <div class="section">
            <h2>📋 All Tasks Overview</h2>
            
            <div class="filters">
                <div class="filter-group">
                    <label for="filterStatus">Status:</label>
                    <select id="filterStatus" onchange="filterTasks()">
                        <option value="">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="searchBox">Search:</label>
                    <input 
                        type="text" 
                        id="searchBox" 
                        placeholder="Search tasks..." 
                        style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px;"
                        onkeyup="filterTasks()"
                    >
                </div>
            </div>

            <div class="table-container">
                <table id="tasksTable">
                    <thead>
                        <tr>
                            <th>Task Title</th>
                            <th>Description</th>
                            <th>Due Date</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 40px;">
                                <div class="empty-state">
                                    <div class="empty-state-icon">📭</div>
                                    <p>No tasks found</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="assets/js/admin-dashboard.js"></script>
</body>
</html>
