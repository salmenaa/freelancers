<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Task Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .btn-back {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background: #7f8c8d;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .stat-description {
            color: #999;
            font-size: 12px;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-group label {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .filter-group select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            color: #333;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
            font-size: 14px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            color: #666;
            font-size: 14px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            display: inline-block;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-in-progress {
            background: #cfe2ff;
            color: #084298;
        }

        .status-completed {
            background: #d1e7dd;
            color: #0f5132;
        }

        .priority-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            display: inline-block;
        }

        .priority-high {
            background: #ffe5e5;
            color: #c41e3a;
        }

        .priority-medium {
            background: #fff4e5;
            color: #d97706;
        }

        .priority-low {
            background: #e5f4ff;
            color: #0284c7;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .chart-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .chart h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .chart-bar {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .chart-label {
            width: 100px;
            color: #666;
            font-size: 13px;
            font-weight: 600;
        }

        .chart-bar-bg {
            flex: 1;
            height: 25px;
            background: #f0f0f0;
            border-radius: 4px;
            margin: 0 10px;
            overflow: hidden;
        }

        .chart-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .chart-value {
            width: 40px;
            text-align: right;
            color: #333;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .filters {
                flex-direction: column;
            }

            .chart-container {
                grid-template-columns: 1fr;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ Admin Dashboard</h1>
            <button class="btn-back" onclick="goBack()">← Back to Home</button>
        </div>

        <!-- Statistics Cards -->
        <div class="dashboard-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalTasksAdmin">0</div>
                <div class="stat-label">Total Tasks</div>
                <div class="stat-description">All tasks across users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedTasksAdmin">0</div>
                <div class="stat-label">Completed</div>
                <div class="stat-description">Successfully finished</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="inProgressTasksAdmin">0</div>
                <div class="stat-label">In Progress</div>
                <div class="stat-description">Currently being worked on</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingTasksAdmin">0</div>
                <div class="stat-label">Pending</div>
                <div class="stat-description">Awaiting action</div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="chart-container">
            <div class="chart">
                <h3>📊 Tasks by Status</h3>
                <div id="statusChart"></div>
            </div>
            <div class="chart">
                <h3>📈 Tasks by Priority</h3>
                <div id="priorityChart"></div>
            </div>
        </div>

        <!-- All Tasks Section -->
        <div class="section">
            <h2>📋 All Tasks Overview</h2>
            
            <div class="filters">
                <div class="filter-group">
                    <label for="filterStatus">Status:</label>
                    <select id="filterStatus" onchange="filterTasks()">
                        <option value="">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="searchBox">Search:</label>
                    <input 
                        type="text" 
                        id="searchBox" 
                        placeholder="Search tasks..." 
                        style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px;"
                        onkeyup="filterTasks()"
                    >
                </div>
            </div>

            <div class="table-container">
                <table id="tasksTable">
                    <thead>
                        <tr>
                            <th>Task Title</th>
                            <th>Description</th>
                            <th>Due Date</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTableBody">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 40px;">
                                <div class="empty-state">
                                    <div class="empty-state-icon">📭</div>
                                    <p>No tasks found</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allTasks = [];

        // Load tasks from localStorage
        function loadTasks() {
            const saved = localStorage.getItem('userTasks');
            allTasks = saved ? JSON.parse(saved) : [];
            updateDashboard();
            displayTasks();
        }

        // Update dashboard statistics
        function updateDashboard() {
            const total = allTasks.length;
            const completed = allTasks.filter(t => t.status === 'completed').length;
            const inProgress = allTasks.filter(t => t.status === 'in-progress').length;
            const pending = allTasks.filter(t => t.status === 'pending').length;

            document.getElementById('totalTasksAdmin').textContent = total;
            document.getElementById('completedTasksAdmin').textContent = completed;
            document.getElementById('inProgressTasksAdmin').textContent = inProgress;
            document.getElementById('pendingTasksAdmin').textContent = pending;

            updateCharts();
        }

        // Update charts
        function updateCharts() {
            updateStatusChart();
            updatePriorityChart();
        }

        // Update status chart
        function updateStatusChart() {
            const statuses = {
                'pending': 0,
                'in-progress': 0,
                'completed': 0
            };

            allTasks.forEach(task => {
                if (statuses.hasOwnProperty(task.status)) {
                    statuses[task.status]++;
                }
            });

            const total = allTasks.length || 1;
            let html = '';

            for (const [status, count] of Object.entries(statuses)) {
                const percentage = (count / total) * 100;
                const label = status.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                
                html += `
                    <div class="chart-bar">
                        <div class="chart-label">${label}</div>
                        <div class="chart-bar-bg">
                            <div class="chart-bar-fill" style="width: ${percentage}%">${count}</div>
                        </div>
                        <div class="chart-value">${count}</div>
                    </div>
                `;
            }

            document.getElementById('statusChart').innerHTML = html;
        }

        // Update priority chart (simulated)
        function updatePriorityChart() {
            const priorities = {
                'High': Math.ceil(allTasks.length * 0.2),
                'Medium': Math.ceil(allTasks.length * 0.5),
                'Low': Math.floor(allTasks.length * 0.3)
            };

            const total = allTasks.length || 1;
            let html = '';

            for (const [priority, count] of Object.entries(priorities)) {
                const percentage = (count / total) * 100;
                
                html += `
                    <div class="chart-bar">
                        <div class="chart-label">${priority}</div>
                        <div class="chart-bar-bg">
                            <div class="chart-bar-fill" style="width: ${percentage}%">${count}</div>
                        </div>
                        <div class="chart-value">${count}</div>
                    </div>
                `;
            }

            document.getElementById('priorityChart').innerHTML = html;
        }

        // Display tasks in table
        function displayTasks() {
            const tableBody = document.getElementById('tasksTableBody');
            const searchValue = document.getElementById('searchBox').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;

            let filteredTasks = allTasks.filter(task => {
                const matchesSearch = task.title.toLowerCase().includes(searchValue) || 
                                     task.description.toLowerCase().includes(searchValue);
                const matchesStatus = !statusFilter || task.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            if (filteredTasks.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px;">
                            <div class="empty-state">
                                <div class="empty-state-icon">🔍</div>
                                <p>No tasks found matching your criteria</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = filteredTasks.map(task => {
                const createdDate = new Date(task.createdAt).toLocaleDateString();
                const statusClass = `status-${task.status}`;
                const statusLabel = capitalizeStatus(task.status);

                return `
                    <tr>
                        <td><strong>${escapeHtml(task.title)}</strong></td>
                        <td>${escapeHtml(task.description || '-')}</td>
                        <td>${task.date}</td>
                        <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
                        <td>${createdDate}</td>
                        <td><button class="btn-delete" onclick="deleteTaskFromAdmin(${task.id})">Delete</button></td>
                    </tr>
                `;
            }).join('');
        }

        // Filter tasks
        function filterTasks() {
            displayTasks();
        }

        // Delete task from admin
        function deleteTaskFromAdmin(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                allTasks = allTasks.filter(t => t.id !== id);
                localStorage.setItem('userTasks', JSON.stringify(allTasks));
                updateDashboard();
                displayTasks();
            }
        }

        // Utility functions
        function capitalizeStatus(status) {
            return status.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        // Load tasks on page load
        loadTasks();

        // Refresh data every 5 seconds
        setInterval(() => {
            const saved = localStorage.getItem('userTasks');
            const newTasks = saved ? JSON.parse(saved) : [];
            if (JSON.stringify(newTasks) !== JSON.stringify(allTasks)) {
                allTasks = newTasks;
                updateDashboard();
                displayTasks();
            }
        }, 5000);
    </script>
</body>
</html>
