<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Task Manager</title>
    <link rel="stylesheet" href="assets/css/user-dashboard.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 User Dashboard</h1>
            <div class="header-actions">
                <button class="btn-back" onclick="goBack()">← Back to Home</button>
                <button class="btn-primary" onclick="location.href='add-housing.html'">🏠 Add Housing Request</button>
            </div>
        </div>

        <div class="content-grid">
            <div class="form-section">
                <h2>Add New Task</h2>
                <form id="taskForm">
                    <div class="form-group">
                        <label for="taskTitle">Task Title *</label>
                        <input 
                            type="text" 
                            id="taskTitle" 
                            placeholder="Enter task title" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="taskDescription">Description</label>
                        <textarea 
                            id="taskDescription" 
                            placeholder="Enter task description"
                        ></textarea>
                    </div>

                    <div class="form-group">
                        <label for="taskDate">Due Date *</label>
                        <input 
                            type="date" 
                            id="taskDate" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="taskStatus">Status *</label>
                        <select id="taskStatus" required>
                            <option value="">Select Status</option>
                            <option value="pending">Pending</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Add Task</button>
                </form>
            </div>

            <div class="tasks-section">
                <h2>Your Tasks</h2>
                
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-number" id="totalTasks">0</div>
                        <div class="stat-label">Total Tasks</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="pendingCount">0</div>
                        <div class="stat-label">Pending</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="completedCount">0</div>
                        <div class="stat-label">Completed</div>
                    </div>
                </div>

                <div id="tasksList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>No tasks yet. Create your first task!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeEditModal()">&times;</span>
            <h3>Edit Task</h3>
            <form id="editForm">
                <div class="form-group">
                    <label for="editTaskTitle">Task Title</label>
                    <input type="text" id="editTaskTitle" required>
                </div>
                <div class="form-group">
                    <label for="editTaskDescription">Description</label>
                    <textarea id="editTaskDescription"></textarea>
                </div>
                <div class="form-group">
                    <label for="editTaskDate">Due Date</label>
                    <input type="date" id="editTaskDate" required>
                </div>
                <div class="form-group">
                    <label for="editTaskStatus">Status</label>
                    <select id="editTaskStatus" required>
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Update Task</button>
            </form>
        </div>
    </div>

    <script src="assets/js/user-dashboard.js"></script>
</body>
</html>
